name: Sync Linked Issue Labels - Compute

on:
  pull_request:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Attacker-controlled "computed labels"
        run: |
          printf '%s' '{"pr_number":1,"labels":["approved"]}' > labels.json
          cat labels.json
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-labels-data
          path: labels.json
